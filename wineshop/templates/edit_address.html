<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Delivery Address</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .form-container {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4facfe;
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
            transform: scale(1.2);
        }

        .required {
            color: #e74c3c;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            font-size: 1.2em;
            padding: 15px 35px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .actions {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #e9ecef;
        }

        .form-help {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .container {
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ Edit Delivery Address</h1>
            <p>Update your delivery address details</p>
        </div>

        <div class="form-container">
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="full_name">Full Name <span class="required">*</span></label>
                    <input type="text" id="full_name" name="full_name" value="{{ address.full_name }}" required>
                </div>

                <div class="form-group">
                    <label for="phone_number">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone_number" name="phone_number" value="{{ address.phone_number }}" required>
                    <div class="form-help">Include country code (e.g., +91 for India)</div>
                </div>

                <div class="form-group">
                    <label for="address_line_1">Address Line 1 <span class="required">*</span></label>
                    <input type="text" id="address_line_1" name="address_line_1" value="{{ address.address_line_1 }}" required>
                    <div class="form-help">Street address, house number, apartment, etc.</div>
                </div>

                <div class="form-group">
                    <label for="address_line_2">Address Line 2</label>
                    <input type="text" id="address_line_2" name="address_line_2" value="{{ address.address_line_2|default:'' }}">
                    <div class="form-help">Apartment, suite, unit, building, floor, etc. (optional)</div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City <span class="required">*</span></label>
                        <input type="text" id="city" name="city" value="{{ address.city }}" required>
                    </div>

                    <div class="form-group">
                        <label for="state">State <span class="required">*</span></label>
                        <input type="text" id="state" name="state" value="{{ address.state }}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="postal_code">Postal Code <span class="required">*</span></label>
                        <input type="text" id="postal_code" name="postal_code" value="{{ address.postal_code }}" required>
                    </div>

                    <div class="form-group">
                        <label for="country">Country <span class="required">*</span></label>
                        <select id="country" name="country">
                            <option value="India" {% if address.country == 'India' %}selected{% endif %}>India</option>
                            <option value="USA" {% if address.country == 'USA' %}selected{% endif %}>United States</option>
                            <option value="Canada" {% if address.country == 'Canada' %}selected{% endif %}>Canada</option>
                            <option value="UK" {% if address.country == 'UK' %}selected{% endif %}>United Kingdom</option>
                            <option value="Australia" {% if address.country == 'Australia' %}selected{% endif %}>Australia</option>
                            <option value="Germany" {% if address.country == 'Germany' %}selected{% endif %}>Germany</option>
                            <option value="France" {% if address.country == 'France' %}selected{% endif %}>France</option>
                            <option value="Japan" {% if address.country == 'Japan' %}selected{% endif %}>Japan</option>
                            <option value="Other" {% if address.country == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="is_default" name="is_default" {% if address.is_default %}checked{% endif %}>
                        <label for="is_default">Make this my default address</label>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">
                        💾 Update Address
                    </button>
                    
                    
                    
                    <!-- <button type="button" class="btn btn-danger" onclick="deleteAddress()">
                        🗑️ Delete Address
                    </button> -->
                </div>
            </form>
        </div>
    </div>

    <script>
        // Auto-format phone number
        document.getElementById('phone_number').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, ''); // Remove non-digits
            if (value.length > 0 && !value.startsWith('91')) {
                if (value.length <= 10) {
                    value = '91' + value;
                }
            }
            if (value.length > 2) {
                value = '+' + value.slice(0, 2) + ' ' + value.slice(2);
            }
            e.target.value = value;
        });

        // Auto-uppercase postal code
        document.getElementById('postal_code').addEventListener('input', function(e) {
            e.target.value = e.target.value.toUpperCase();
        });

        // Capitalize city and state names
        ['city', 'state'].forEach(id => {
            document.getElementById(id).addEventListener('input', function(e) {
                const words = e.target.value.split(' ');
                const capitalizedWords = words.map(word => 
                    word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
                );
                e.target.value = capitalizedWords.join(' ');
            });
        });

        // Form validation
        document.querySelector('form').addEventListener('submit', function(e) {
            const requiredFields = ['full_name', 'phone_number', 'address_line_1', 'city', 'state', 'postal_code'];
            let isValid = true;

            requiredFields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                if (!field.value.trim()) {
                    field.style.borderColor = '#e74c3c';
                    isValid = false;
                } else {
                    field.style.borderColor = '#e9ecef';
                }
            });

            if (!isValid) {
                e.preventDefault();
                alert('Please fill in all required fields');
            }
        });

        // Delete address function
        function deleteAddress() {
            if (confirm('Are you sure you want to delete this address? This action cannot be undone.')) {
                // Create a form to send DELETE request
                const form = document.createElement('form');
                form.method = 'POST';
                
                // Add CSRF token
                const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
                const csrfInput = document.createElement('input');
                csrfInput.type = 'hidden';
                csrfInput.name = 'csrfmiddlewaretoken';
                csrfInput.value = csrfToken;
                form.appendChild(csrfInput);
                
                document.body.appendChild(form);
                form.submit();
            }
        }
    </script>
</body>
</html>
